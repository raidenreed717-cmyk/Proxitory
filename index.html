<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 20vh; background: #f4f4f9; color: #333; }
        input[type="text"] { width: 80%; max-width: 400px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 12px 20px; font-size: 16px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Web Portal</h1>
    <p>Enter a destination URL below:</p>
    <form onsubmit="loadSite(event)">
        <input type="text" id="targetUrl" placeholder="https://example.com" required><br>
        <button type="submit">Go</button>
    </form>
    <script>
        function loadSite(event) {
            event.preventDefault();
            let url = document.getElementById('targetUrl').value;
            if (!url.startsWith('http://') && !url.startsWith('https://')) { url = 'https://' + url; }
            window.location.href = "https://r.jina.ai/" + url;
        }
    </script>
</body>
</html>
